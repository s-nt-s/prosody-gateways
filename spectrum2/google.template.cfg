[service]
jid={{GOOGLE_COMPONENT_JID}}
allowed_servers={{XMPP_DOMAIN}}
allowed_servers={{GOOGLE_COMPONENT_JID}}

server=prosody
port=5347
password={{XMPP_ADMIN_PASSWORD}}

backend=/usr/bin/spectrum2_libpurple_backend
protocol=prpl-googlechat

server_mode=0

pidfile=/run/spectrum2/spectrum2.pid

[registration]
auto_register=0
enable_public_registration=1
needPassword=1
needRegistration=1
language=es
username_label=Google Chat email
password_label=Google Chat Cookies
instructions=Consulta https://github.com/EionRobb/purple-googlechat para saber como introducir las Cookies en el campo Password

[database]
type=sqlite3

[identity]
name=Google Chat
type=xmpp
category=gateway

[purple]
unravel_google_url = true
fetch_image_history = true
hide_self = false
treat_invisible_as_offline = false
show-call-links = true